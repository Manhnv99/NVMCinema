services:
  cinema-db:
    image: mysql:8.4
    container_name: cinema-db
    restart: always
    environment:
      MYSQL_DATABASE: nvmcinema
      MYSQL_ROOT_PASSWORD: Manh99123
    ports:
      - "3306:3306"
    volumes:
      - cinema_data:/var/lib/mysql
      
  cinema-fe:
    image: manhnv99/cinema-fe:0.0.1
    container_name: cinema-fe
    restart: always
    environment:
      VITE_REACT_APP_API_URL: http://221.132.19.112
      VITE_REACT_APP_BE_DOMAIN: http://221.132.19.112/
      VITE_REACT_APP_FE_DOMAIN: http://221.132.19.112/
    ports:
      - "127.0.0.1:9999:80"
    depends_on:
      - cinema-be

  cinema-redis:
    image: redis:7
    container_name: cinema-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - cinema_redis_data:/var/lib/redis_db

  cinema-be:
    container_name: cinema-be
    image: manhnv99/cinema-be:0.0.1
    restart: always
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      #DATABASE INFORMATION
      MYSQL_HOST: cinema-db
      MYSQL_PORT: 3306
      MYSQL_DB: nvmcinema
      MYSQL_USER: root
      MYSQL_PASSWORD: Manh99123
      SERVER_PORT: 8080
      DOMAIN_BE: cinema-be
      REDIS_HOST: cinema-redis
      REDIS_PORT: 6379
      # Các domain được phép gọi API (CORS), phân tách bằng dấu phẩy
      CORS_ALLOWED_ORIGINS: http://221.132.19.112
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      - cinema-db
      - cinema-redis
    volumes:
      - cinemma_be_data:/var/lib/cinemma_be_db
volumes:
  cinema_data:
    name: cinema_data
  cinemma_be_data:
    name: cinemma_be_data
  cinema_redis_data:
    name: cinema_redis_data

networks:
  default:
    name: cinema-networks
